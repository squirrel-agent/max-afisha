services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-max_afisha}
      POSTGRES_USER: ${POSTGRES_USER:-max_afisha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-max_afisha}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-max_afisha} -d ${POSTGRES_DB:-max_afisha}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-max_afisha}:${POSTGRES_PASSWORD:-max_afisha}@postgres:5432/${POSTGRES_DB:-max_afisha}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-local-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      TEXT_ENCODER_MODEL: ${TEXT_ENCODER_MODEL:-intfloat/multilingual-e5-small}
      TEXT_ENCODER_DEVICE: ${TEXT_ENCODER_DEVICE:-cpu}
      AUTO_EMBED_AFTER_INGEST: ${AUTO_EMBED_AFTER_INGEST:-true}
      PARSER_SERVICE_URL: ${PARSER_SERVICE_URL:-http://parser:8010}
      RECOMMENDATION_MIN_SEMANTIC_SIMILARITY: ${RECOMMENDATION_MIN_SEMANTIC_SIMILARITY:-0.78}
      RECOMMENDATION_MIN_FINAL_SCORE: ${RECOMMENDATION_MIN_FINAL_SCORE:-0.62}
      NEURAL_SEARCH_MIN_SIMILARITY: ${NEURAL_SEARCH_MIN_SIMILARITY:-0.78}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_NAME: ${MAX_BOT_NAME:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_INIT_DATA_MAX_AGE_SECONDS: ${MAX_INIT_DATA_MAX_AGE_SECONDS:-3600}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes: [hf_cache:/root/.cache/huggingface]
    depends_on:
      postgres: {condition: service_healthy}
  parser:
    build: ./parser-service
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-local-admin}
      DAILY_SYNC: ${DAILY_SYNC:-1}
      PARSER_LIMIT: ${PARSER_LIMIT:-700}
    ports: ["${PARSER_PORT:-8010}:8010"]
    depends_on: [backend]
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-8080}:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  hf_cache:
